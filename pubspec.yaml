name: esp32_gps_tracker
description: Real-time GPS Tracker powered by ESP32

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # HTTP & WebSocket for ESP32 communication
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  iconsax: ^0.0.8
  percent_indicator: ^4.2.3
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  
  # Storage
  shared_preferences: ^2.2.3
  
  # Utils
  intl: ^0.19.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
